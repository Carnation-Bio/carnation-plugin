name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package structure
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          plugin = root / "plugins" / "carnation"
          json_files = [
              root / ".agents" / "plugins" / "marketplace.json",
              root / ".claude-plugin" / "marketplace.json",
              plugin / "plugin.json",
              plugin / "mcp.json",
              plugin / ".codex-plugin" / "plugin.json",
              plugin / ".claude-plugin" / "plugin.json",
              plugin / ".mcp.json",
          ]
          documents = {path: json.loads(path.read_text()) for path in json_files}

          expected_version = "0.2.3"
          endpoint = "https://public-api.carnation.bio/mcp"
          manifests = [
              documents[plugin / "plugin.json"],
              documents[plugin / ".codex-plugin" / "plugin.json"],
              documents[plugin / ".claude-plugin" / "plugin.json"],
          ]
          assert all(item["name"] == "carnation" for item in manifests)
          assert all(item["version"] == expected_version for item in manifests)
          assert documents[root / ".claude-plugin" / "marketplace.json"]["plugins"][0]["version"] == expected_version
          assert documents[plugin / "mcp.json"]["mcpServers"]["carnation"]["url"] == endpoint
          assert documents[plugin / ".mcp.json"]["mcpServers"]["carnation"]["url"] == endpoint

          skill = (plugin / "skills" / "carnation" / "SKILL.md").read_text()
          assert skill.startswith("---\nname: carnation\n")
          assert "description:" in skill.split("---", 2)[1]

          # Public repository: internal planning and submission notes live elsewhere.
          assert not (root / "plans").exists()
          assert not (root / "SUBMISSION_DRAFT.md").exists()

          forbidden = [plugin / "hooks", plugin / "scripts"]
          assert not any(path.exists() for path in forbidden)
          assert not any(path.is_file() and path.stat().st_mode & 0o111 for path in plugin.rglob("*"))
          helper = plugin / "skills" / "carnation" / "scripts"
          build = json.loads((helper / "build.json").read_text())
          shipped = {
              path.relative_to(helper).as_posix(): path.read_bytes()
              for path in helper.rglob("*")
              if path.is_file() and path.name != "build.json"
          }
          assert set(shipped) == set(build["files"]), sorted(set(shipped) ^ set(build["files"]))
          for name, data in shipped.items():
              assert build["files"][name] == hashlib.sha256(data).hexdigest(), name
              # Directory scanners hold code they cannot read.
              assert b"WebAssembly" not in data, name
          assert build["runtime"] == "Node.js 24"
          assert build["source_repository"] == "https://github.com/Carnation-Bio/carnation"
          assert re.fullmatch(r"[0-9a-f]{40}", build["source_commit"])
          assert shipped["THIRD_PARTY_NOTICES.txt"]
          # The directory holds any file other than an image of 256 KiB or more.
          images = {".png", ".jpg", ".jpeg", ".gif", ".webp"}
          large = [
              str(path)
              for path in plugin.rglob("*")
              if path.is_file()
              and path.suffix.lower() not in images
              and path.stat().st_size >= 256 * 1024
          ]
          assert not large, large
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute standalone helper
        run: node plugins/carnation/skills/carnation/scripts/carnation-upload.mjs --help
